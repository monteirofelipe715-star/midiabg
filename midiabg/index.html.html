<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mídia | AD Madureira BG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B00; --primary-dark: #E55A00;
            --dark: #0A0A0A; --dark-soft: #1A1A1A; --dark-card: #1F1F1F;
            --gray: #8B8B8B; --gray-light: #2A2A2A; --white: #FFFFFF;
            --green: #00C853; --red: #FF3B30; --yellow: #FFB300;
        }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--white); line-height: 1.6; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, rgba(255,107,0,0.08) 0%, transparent 60%), var(--dark); }
        .login-box { background: var(--dark-soft); border: 1px solid var(--gray-light); border-radius: 20px; padding: 40px; max-width: 400px; width: 90%; text-align: center; }
        .login-logo { width: 100px; height: 100px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 2px solid var(--primary); }
        .login-logo img { width: 100%; height: 100%; object-fit: cover; }
        .login-input { width: 100%; background: var(--dark); border: 1px solid var(--gray-light); border-radius: 10px; padding: 12px; color: var(--white); margin-bottom: 15px; outline: none; }
        .login-btn { width: 100%; background: var(--primary); color: var(--white); border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; }

        #portal { display: none; }
        header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gray-light); }
        .nav { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; }
        .nav-logo { width: 35px; height: 35px; border-radius: 50%; overflow: hidden; border: 1px solid var(--primary); }
        .nav-links { display: flex; gap: 5px; align-items: center; overflow-x: auto; }
        .nav-links a, .nav-links button { color: var(--gray); text-decoration: none; font-size: 0.8rem; padding: 8px 12px; border-radius: 8px; background: none; border: none; cursor: pointer; white-space: nowrap; }
        .nav-links a:hover, .nav-links button:hover { color: var(--white); background: var(--gray-light); }
        .btn-drive { background: rgba(255,107,0,0.1) !important; color: var(--primary) !important; font-weight: 700; }

        section { padding: 40px 0; border-bottom: 1px solid var(--gray-light); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .card { background: var(--dark-card); border: 1px solid var(--gray-light); border-radius: 14px; padding: 20px; transition: 0.3s; }
        .card:hover { border-color: var(--primary); }

        .scale-row { display: grid; grid-template-columns: 1fr 1fr 100px; padding: 15px; border-bottom: 1px solid var(--gray-light); align-items: center; }
        .btn-action { background: var(--gray-light); border: none; color: var(--white); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .btn-rotate { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }

        .presence-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .presence-item { display: flex; flex-direction: column; gap: 10px; }
        .absent-fields { display: none; margin-top: 5px; }

        .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 5px; border-radius: 8px; }
        .top-rank { background: rgba(255,107,0,0.15); border: 1px solid var(--primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: var(--dark-soft); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }

        .cal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .cal-day { background: var(--dark-card); border: 1px solid var(--gray-light); border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .cal-day:hover { border-color: var(--primary); }
        .cal-day.done { border-color: var(--green); background: rgba(0,200,83,0.05); }
        .cal-day.done .type { color: var(--green); }

        .notice-input { display: flex; gap: 10px; margin-bottom: 20px; }
        .notice-item { background: var(--gray-light); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }

        .status-badge { padding: 4px 8px; border-radius: 100px; font-size: 0.7rem; font-weight: 700; }
        .bg-ok { background: rgba(0,200,83,0.2); color: var(--green); }
        .bg-warn { background: rgba(255,179,0,0.2); color: var(--yellow); }
        .bg-error { background: rgba(255,59,48,0.2); color: var(--red); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-logo"><img src="logo-midia.png" alt="Logo"></div>
        <h2>Portal Mídia</h2>
        <p style="color:var(--gray); font-size:0.8rem; margin-bottom:20px">Acesso Restrito</p>
        <input type="password" id="pass" class="login-input"
